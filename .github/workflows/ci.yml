name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt jq
      - name: ShellCheck
        run: |
          shellcheck bootstrap.sh.in install.sh.in
          find bin lib modules scripts tests tools -type f \( -name '*.sh' -o -path 'bin/opsctl' \) -print0 | xargs -0 shellcheck
      - name: shfmt
        run: shfmt -d -i 2 -ci bootstrap.sh.in install.sh.in bin lib modules scripts tests tools
      - name: Tests and secret scan
        run: tests/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build release assets
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: scripts/build-release.sh
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi
